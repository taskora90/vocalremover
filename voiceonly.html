<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Voice - Synchronized Lyric Maker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl glass-card rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">🎬 Only Voice - Lyric Maker</h1>
            <p class="text-xs text-gray-400 mt-1">অডিও ট্রিম, টাইম সিঙ্ক ও ট্রেন্ডিং ইফেক্টসহ লিরিক ভিডিও তৈরি করুন!</p>
        </div>

        <!-- Branding Settings -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">পেজের নাম (Watermark Text):</label>
                <input type="text" id="pageNameInput" value="Only Voice" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">পেজের লোগো/আইকন (PNG/JPG):</label>
                <input type="file" id="logoFile" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-700 cursor-pointer">
            </div>
        </div>

        <!-- Step 1: Audio, Background & Effect Selection -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-2">অডিও ফাইল (Vocal MP3):</label>
                <input type="file" id="audioFile" accept="audio/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-2">ব্যাকগ্রাউন্ড ডিজাইন:</label>
                <select id="bgTheme" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-gray-300 focus:outline-none focus:border-purple-500">
                    <option value="gradient1">রয়্যাল পার্পল গ্রেডিয়েন্ট</option>
                    <option value="starry">তারাভরা রাত ও পার্টিকলস</option>
                    <option value="sunset">ইমোশনাল সানসেট</option>
                    <option value="custom">🎥 কাস্টম ভিডিও ব্যাকগ্রাউন্ড</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-2">লিরিক টেক্সট ইফেক্ট:</label>
                <select id="lyricEffect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-gray-300 focus:outline-none focus:border-purple-500">
                    <option value="standard">✨ ক্লাসিক গ্লো ও শ্যাডো</option>
                    <option value="neon">💡 নিয়ন গ্লো (Neon Glow)</option>
                    <option value="bounce">🔥 বাউন্সি পপ-আপ (Reels Style)</option>
                    <option value="gradientText">🌈 কালারফুল গ্রেডিয়েন্ট টেক্সট</option>
                    <option value="wordByWord">🎤 ওয়ার্ড-বাই-ওয়ার্ড (Karaoke Style)</option>
                    <option value="fadeEffect">🌫️ স্মুথ ফেড ইন-আউট (Fade Effect)</option>
                </select>
            </div>
        </div>

        <!-- Audio Trimming Section -->
        <div id="trimSection" class="hidden bg-slate-900/50 p-4 rounded-xl border border-slate-800 space-y-3">
            <h3 class="text-xs font-semibold text-purple-300">✂️ অডিও ট্রিম / কেটে ছোট করুন:</h3>
            <p id="audioDurationText" class="text-xs text-gray-400">মোট স্থায়িত্ব: ০ সেকেন্ড</p>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">শুরু সময় (সেকেন্ড):</label>
                    <input type="number" id="trimStart" value="0" step="0.1" min="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">শেষ সময় (সেকেন্ড):</label>
                    <input type="number" id="trimEnd" value="0" step="0.1" min="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-purple-500">
                </div>
            </div>
            <button id="applyTrimBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition shadow-md text-xs">
                ✂️ অডিও কেটে এই নির্দিষ্ট অংশটি রাখুন
            </button>
        </div>

        <!-- Custom Video Upload Box -->
        <div id="customVideoSection" class="hidden bg-slate-900/50 p-4 rounded-xl border border-slate-800 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-purple-400 mb-2">ব্যাকগ্রাউন্ড ভিডিও আপলোড করুন (MP4):</label>
                <input type="file" id="customVideoFile" accept="video/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
            </div>
            <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" id="autoZoomCheck" class="w-4 h-4 text-purple-600 bg-slate-800 border-slate-700 rounded focus:ring-purple-500 cursor-pointer">
                <label for="autoZoomCheck" class="text-xs text-gray-300 cursor-pointer">অটো জুম করুন (কোর্নারের লোগো/লেখা কাটার জন্য)</label>
            </div>
        </div>

        <!-- Step 2: Bengali Lyrics Input -->
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-2">বাংলা লিরিকস (প্রতি লাইনে একটি করে বাক্য লিখুন):</label>
            <textarea id="lyricsInput" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-purple-500" placeholder="যেমন:
চোখের জলে ভিজে গেছে মন...
তুমি ছাড়া আজ বড় একা এই জীবন..."></textarea>
        </div>

        <!-- Step 3: Interactive Sync Control Box -->
        <div class="bg-slate-900/80 p-4 rounded-xl border border-purple-500/40 text-center space-y-3">
            <h3 class="text-xs font-semibold text-purple-300">🎙️ লিরিক টাইম সিঙ্ক (টাইমিং মেলানোর উপায়):</h3>
            <p id="syncStatusText" class="text-xs text-gray-400">প্রথমে অডিও ট্রিম করে লিরিক দিয়ে নিচের 'সিঙ্ক শুরু করুন' বাটনে ক্লিক করুন।</p>
            <button id="startSyncBtn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-xl transition shadow-md text-xs disabled:opacity-50" disabled>
                ⏱️ লিরিক সিঙ্ক শুরু করুন (ট্যাপ করে টাইম সেট করুন)
            </button>
            <button id="tapLineBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm hidden">
                👉 গান বাজার সময় এই লাইনে ট্যাপ করুন (পরবর্তী লাইন)
            </button>
        </div>

        <!-- Step 4: Live Preview Canvas -->
        <div class="relative w-full aspect-[9/16] max-h-[350px] bg-black rounded-xl overflow-hidden flex flex-col items-center justify-center border border-slate-700 shadow-inner">
            <canvas id="videoCanvas" width="720" height="1280" class="w-full h-full object-contain"></canvas>
        </div>

        <!-- Controls & Record Button -->
        <div class="flex flex-col sm:flex-row gap-3">
            <button id="playPreviewBtn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition shadow-lg text-sm disabled:opacity-50" disabled>
                ▶ প্রিভিউ দেখুন ও শুনুন
            </button>
            <button id="recordBtn" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 rounded-xl transition shadow-lg text-sm disabled:opacity-50" disabled>
                🔴 ভিডিও রেকর্ড ও ডাউনলোড করুন
            </button>
        </div>

        <!-- Manual Stop Recording Button -->
        <div id="stopContainer" class="hidden">
            <button id="stopRecordBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm animate-pulse">
                🛑 রেকর্ডিং থামিয়ে ভিডিও ডাউনলোড করুন
            </button>
        </div>
    </div>
<style>
    body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'SolaimanLipi', sans-serif;
    }
    .glass-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
</style>
<script>
    const audioFile = document.getElementById('audioFile');
    const lyricsInput = document.getElementById('lyricsInput');
    const playPreviewBtn = document.getElementById('playPreviewBtn');
    const recordBtn = document.getElementById('recordBtn');
    const startSyncBtn = document.getElementById('startSyncBtn');
    const tapLineBtn = document.getElementById('tapLineBtn');
    const syncStatusText = document.getElementById('syncStatusText');
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const bgTheme = document.getElementById('bgTheme');
    const lyricEffect = document.getElementById('lyricEffect');
    const pageNameInput = document.getElementById('pageNameInput');
    const logoFile = document.getElementById('logoFile');
    const customVideoSection = document.getElementById('customVideoSection');
    const customVideoFile = document.getElementById('customVideoFile');
    const autoZoomCheck = document.getElementById('autoZoomCheck');
    const stopContainer = document.getElementById('stopContainer');
    const stopRecordBtn = document.getElementById('stopRecordBtn');

    // Trimming Elements
    const trimSection = document.getElementById('trimSection');
    const audioDurationText = document.getElementById('audioDurationText');
    const trimStart = document.getElementById('trimStart');
    const trimEnd = document.getElementById('trimEnd');
    const applyTrimBtn = document.getElementById('applyTrimBtn');

    let audioElement = null;
    let audioContext = null;
    let rawAudioBuffer = null;
    let customVideoElement = document.createElement('video');
    customVideoElement.loop = true;
    customVideoElement.muted = true;
    let lines = [];
    let lineTimestamps = [];
    let currentSyncIndex = 0;
    let animationId = null;
    let syncAnimationId = null;
    let logoImg = null;
    let stars = [];

    for(let i=0; i<50; i++) {
        stars.push({
            x: Math.random() * 720,
            y: Math.random() * 1280,
            radius: Math.random() * 3,
            alpha: Math.random()
        });
    }

    bgTheme.addEventListener('change', (e) => {
        if (e.target.value === 'custom') {
            customVideoSection.classList.remove('hidden');
        } else {
            customVideoSection.classList.add('hidden');
            customVideoElement.pause();
        }
    });

    customVideoFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            customVideoElement.src = URL.createObjectURL(file);
            customVideoElement.load();
        }
    });

    logoFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                logoImg = new Image();
                logoImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // Handle Audio Upload & Decoding for Trimming
    audioFile.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (audioElement) audioElement.pause();

        const arrayBuffer = await file.arrayBuffer();
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        rawAudioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        const duration = rawAudioBuffer.duration.toFixed(1);
        audioDurationText.textContent = `মোট স্থায়িত্ব: ${duration} সেকেন্ড`;
        trimStart.value = 0;
        trimEnd.value = duration;
        trimEnd.max = duration;

        trimSection.classList.remove('hidden');
        syncStatusText.textContent = 'অডিও আপলোড হয়েছে। চাইলে ট্রিম করুন অথবা সরাসরি সিঙ্ক শুরু করুন।';
        startSyncBtn.removeAttribute('disabled');

        const wavBlob = bufferToWavBlob(rawAudioBuffer);
        audioElement = new Audio(URL.createObjectURL(wavBlob));
        audioElement.crossOrigin = "anonymous";
    });

    // Apply Audio Trimming
    applyTrimBtn.addEventListener('click', () => {
        if (!rawAudioBuffer) return;

        let startSec = parseFloat(trimStart.value) || 0;
        let endSec = parseFloat(trimEnd.value) || rawAudioBuffer.duration;

        if (startSec < 0) startSec = 0;
        if (endSec > rawAudioBuffer.duration) endSec = rawAudioBuffer.duration;
        if (startSec >= endSec) {
            alert('শেষ সময় শুরু সময় থেকে বেশি হতে হবে!');
            return;
        }

        const sampleRate = rawAudioBuffer.sampleRate;
        const startFrame = Math.floor(startSec * sampleRate);
        const endFrame = Math.floor(endSec * sampleRate);
        const frameCount = endFrame - startFrame;

        const trimmedBuffer = audioContext.createBuffer(
            rawAudioBuffer.numberOfChannels,
            frameCount,
            sampleRate
        );

        for (let channel = 0; channel < rawAudioBuffer.numberOfChannels; channel++) {
            const sourceData = rawAudioBuffer.getChannelData(channel);
            const trimmedData = trimmedBuffer.getChannelData(channel);
            for (let i = 0; i < frameCount; i++) {
                trimmedData[i] = sourceData[startFrame + i];
            }
        }

        const wavBlob = bufferToWavBlob(trimmedBuffer);
        audioElement = new Audio(URL.createObjectURL(wavBlob));
        audioElement.crossOrigin = "anonymous";

        alert(`✅ সফলভাবে অডিও ট্রিম করা হয়েছে (${startSec}s থেকে ${endSec}s)!`);
        startSyncBtn.removeAttribute('disabled');
    });

    // Helper: Convert AudioBuffer to WAV Blob
    function bufferToWavBlob(buffer) {
        const numOfChan = buffer.numberOfChannels;
        const length = buffer.length * numOfChan * 2 + 44;
        const out = new DataView(new ArrayBuffer(length));
        let channels = [];
        let sampleRate = buffer.sampleRate;
        let offset = 0;
        let pos = 0;

        function writeString(str) {
            for (let i = 0; i < str.length; i++) {
                out.setUint8(pos++, str.charCodeAt(i));
            }
        }

        writeString('RIFF');
        out.setUint32(pos, length - 8, true); pos += 4;
        writeString('WAVE');
        writeString('fmt ');
        out.setUint32(pos, 16, true); pos += 4;
        out.setUint16(pos, 1, true); pos += 2;
        out.setUint16(pos, numOfChan, true); pos += 2;
        out.setUint32(pos, sampleRate, true); pos += 4;
        out.setUint32(pos, sampleRate * 2 * numOfChan, true); pos += 4;
        out.setUint16(pos, numOfChan * 2, true); pos += 2;
        out.setUint16(pos, 16, true); pos += 2;
        writeString('data');
        out.setUint32(pos, length - pos - 4, true); pos += 4;

        for (let i = 0; i < buffer.numberOfChannels; i++) {
            channels.push(buffer.getChannelData(i));
        }

        while (offset < buffer.length) {
            for (let i = 0; i < numOfChan; i++) {
                let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                out.setInt16(pos, sample, true); pos += 2;
            }
            offset++;
        }

        return new Blob([out.buffer], { type: 'audio/wav' });
    }

    // Tap-to-Sync Feature Logic
    startSyncBtn.addEventListener('click', () => {
        const text = lyricsInput.value.trim();
        if (!text) {
            alert('দয়া করে প্রথমে লিরিকস লিখুন!');
            return;
        }
        lines = text.split('\n').filter(l => l.trim() !== '');
        lineTimestamps = [];
        currentSyncIndex = 0;

        audioElement.currentTime = 0;
        audioElement.play();
        if (bgTheme.value === 'custom') {
            customVideoElement.currentTime = 0;
            customVideoElement.play();
        }

        startSyncBtn.classList.add('hidden');
        tapLineBtn.classList.remove('hidden');
        syncStatusText.innerHTML = `সঠিক সময়ে ট্যাপ করুন: <strong class="text-pink-400">"${lines[0]}"</strong>`;
        tapLineBtn.textContent = `১ম লাইনের সময় মার্ক করতে ট্যাপ করুন`;

        function syncLoop() {
            if (audioElement.paused || audioElement.ended) return;
            let currentTime = audioElement.currentTime;
            let currentText = getActiveLyric(currentTime);
            drawCanvasContent(bgTheme.value, lyricEffect.value, currentTime, currentText);
            syncAnimationId = requestAnimationFrame(syncLoop);
        }
        syncLoop();
    });

    tapLineBtn.addEventListener('click', () => {
        let t = audioElement.currentTime;
        let adjustedTime = Math.max(0, t - 0.4);
        lineTimestamps.push(adjustedTime);
        currentSyncIndex++;

        if (currentSyncIndex < lines.length) {
            syncStatusText.innerHTML = `পরবর্তী লাইন: <strong class="text-pink-400">"${lines[currentSyncIndex]}"</strong>`;
            tapLineBtn.textContent = `পরবর্তী লাইনের জন্য ট্যাপ করুন (${currentSyncIndex + 1}/${lines.length})`;
        } else {
            audioElement.pause();
            if (bgTheme.value === 'custom') customVideoElement.pause();
            cancelAnimationFrame(syncAnimationId);
            tapLineBtn.classList.add('hidden');
            startSyncBtn.classList.remove('hidden');
            startSyncBtn.textContent = '✅ সিঙ্ক সম্পন্ন! পুনরায় সিঙ্ক করুন';
            syncStatusText.textContent = 'সকল লিরিকের টাইম সফলভাবে সেট হয়েছে!';
            playPreviewBtn.removeAttribute('disabled');
            recordBtn.removeAttribute('disabled');
        }
    });
</script>
<script>
    function getActiveLyric(currentTime) {
        if (lineTimestamps.length === 0) return lines[0] || '';
        let activeIdx = 0;
        for (let i = 0; i < lineTimestamps.length; i++) {
            if (currentTime >= lineTimestamps[i]) {
                activeIdx = i;
            }
        }
        return lines[activeIdx] || '';
    }

    // Enhanced Text Rendering with New Effects (Word-by-Word & Fade)
    function wrapTextWithEffect(context, text, x, y, maxWidth, lineHeight, effect, currentTime) {
        let words = text.split(' ');
        let line = '';
        let linesArray = [];

        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = context.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                linesArray.push(line);
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        linesArray.push(line);

        let startY = y - ((linesArray.length - 1) * lineHeight) / 2;

        context.save();

        // Fade Effect Handling (Opacity Animation)
        if (effect === 'fadeEffect') {
            let activeLineIdx = 0;
            for (let i = 0; i < lineTimestamps.length; i++) {
                if (currentTime >= lineTimestamps[i]) activeLineIdx = i;
            }
            let lineStartTime = lineTimestamps[activeLineIdx] || 0;
            let timeSinceStart = currentTime - lineStartTime;
            let alpha = Math.min(1, timeSinceStart * 2.5); // Fade in over 0.4s
            context.globalAlpha = alpha;
        }

        if (effect === 'neon') {
            context.shadowColor = '#ec4899';
            context.shadowBlur = 25;
            context.fillStyle = '#f472b6';
        } else if (effect === 'gradientText') {
            let grad = context.createLinearGradient(x - 200, startY, x + 200, startY + lineHeight);
            grad.addColorStop(0, '#ec4899');
            grad.addColorStop(0.5, '#a855f7');
            grad.addColorStop(1, '#3b82f6');
            context.fillStyle = grad;
            context.shadowColor = 'rgba(0, 0, 0, 0.8)';
            context.shadowBlur = 10;
        } else if (effect === 'bounce') {
            context.fillStyle = '#ffffff';
            context.shadowColor = '#9333ea';
            context.shadowBlur = 20;
        } else {
            context.fillStyle = '#ffffff';
            context.shadowColor = 'rgba(0, 0, 0, 0.9)';
            context.shadowBlur = 15;
        }

        // Word-by-Word (Karaoke) Effect Handling
        if (effect === 'wordByWord') {
            let activeLineIdx = 0;
            for (let i = 0; i < lineTimestamps.length; i++) {
                if (currentTime >= lineTimestamps[i]) activeLineIdx = i;
            }
            let lineStartTime = lineTimestamps[activeLineIdx] || 0;
            let lineEndTime = lineTimestamps[activeLineIdx + 1] || (lineStartTime + 3);
            let lineDuration = lineEndTime - lineStartTime;
            let timePassed = currentTime - lineStartTime;
            let totalWords = words.length;
            let wordsToShow = Math.floor((timePassed / lineDuration) * totalWords);
            wordsToShow = Math.max(1, Math.min(totalWords, wordsToShow));

            let currentRenderText = words.slice(0, wordsToShow).join(' ');
            context.fillText(currentRenderText, x, startY);
        } else {
            for(let k = 0; k < linesArray.length; k++) {
                context.fillText(linesArray[k], x, startY + (k * lineHeight));
            }
        }
        context.restore();
    }

    function drawCanvasContent(theme, effect, progress, currentText) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (theme === 'custom' && customVideoElement.readyState >= 2) {
            ctx.save();
            if (autoZoomCheck.checked) {
                let scale = 1.15;
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(scale, scale);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
            }
            ctx.drawImage(customVideoElement, 0, 0, canvas.width, canvas.height);
            ctx.restore();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (theme === 'starry') {
            ctx.fillStyle = '#09090b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.abs(Math.sin(progress + star.alpha));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        } else {
            let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            if (theme === 'gradient1') {
                grad.addColorStop(0, '#3b0764');
                grad.addColorStop(1, '#0f172a');
            } else {
                grad.addColorStop(0, '#831843');
                grad.addColorStop(1, '#311026');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 350 + Math.sin(progress) * 40, 0, Math.PI * 2);
            ctx.fill();
        }

        // Branding Watermark
        const padding = 40;
        const pageName = pageNameInput.value || 'Only Voice';

        ctx.save();
        ctx.font = 'bold 28px sans-serif';
        let textWidth = ctx.measureText(pageName).width;
        let pillWidth = textWidth + 80;
        let pillHeight = 60;
        let pillX = padding;
        let pillY = padding;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillWidth, pillHeight, 30);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (logoImg && logoImg.complete) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(pillX + 30, pillY + 30, 20, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(logoImg, pillX + 10, pillY + 10, 40, 40);
            ctx.restore();
        } else {
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.arc(pillX + 30, pillY + 30, 12, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(pageName, pillX + 65, pillY + 31);
        ctx.restore();

        // Draw Lyrics
        ctx.save();
        ctx.font = 'bold 45px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let renderX = canvas.width / 2;
        let renderY = canvas.height / 2;

        if (effect === 'bounce') {
            let scale = 1 + Math.sin(progress * 8) * 0.04;
            ctx.translate(renderX, renderY);
            ctx.scale(scale, scale);
            ctx.translate(-renderX, -renderY);
        }

        wrapTextWithEffect(ctx, currentText, renderX, renderY, canvas.width - 120, 65, effect, progress);
        ctx.restore();
    }

    playPreviewBtn.addEventListener('click', () => {
        if (!audioElement) return;

        audioElement.currentTime = 0;
        audioElement.play();
        if (bgTheme.value === 'custom') {
            customVideoElement.currentTime = 0;
            customVideoElement.play();
        }

        function updateCanvas() {
            if (audioElement.ended) {
                cancelAnimationFrame(animationId);
                if (bgTheme.value === 'custom') customVideoElement.pause();
                playPreviewBtn.textContent = '▶ প্রিভিউ দেখুন ও শুনুন';
                return;
            }

            let currentTime = audioElement.currentTime;
            let currentText = getActiveLyric(currentTime);

            drawCanvasContent(bgTheme.value, lyricEffect.value, currentTime, currentText);
            animationId = requestAnimationFrame(updateCanvas);
        }

        playPreviewBtn.textContent = '⏸ প্লে হচ্ছে...';
        updateCanvas();
    });

    // Video Recording & Download
    let mediaRecorder;
    let recordedChunks = [];

    recordBtn.addEventListener('click', () => {
        if (!audioElement) return;

        audioElement.currentTime = 0;
        audioElement.play();
        if (bgTheme.value === 'custom') {
            customVideoElement.currentTime = 0;
            customVideoElement.play();
        }

        const canvasStream = canvas.captureStream(30);
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(audioElement);
        const destination = audioCtx.createMediaStreamDestination();
        source.connect(destination);
        source.connect(audioCtx.destination);

        const combinedStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...destination.stream.getAudioTracks()
        ]);

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp9' });

        mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'only-voice-synced-video.webm';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            recordBtn.textContent = '🔴 ভিডিও রেকর্ড ও ডাউনলোড করুন';
            recordBtn.removeAttribute('disabled');
            stopContainer.classList.add('hidden');
        };

        mediaRecorder.start();
        recordBtn.textContent = '⏳ রেকর্ডিং চলছে...';
        recordBtn.setAttribute('disabled', 'true');
        stopContainer.classList.remove('hidden');

        function recordLoop() {
            if (audioElement.ended) {
                stopRecordingProcess();
                return;
            }

            let currentTime = audioElement.currentTime;
            let currentText = getActiveLyric(currentTime);

            drawCanvasContent(bgTheme.value, lyricEffect.value, currentTime, currentText);
            animationId = requestAnimationFrame(recordLoop);
        }

        recordLoop();
    });

    function stopRecordingProcess() {
        if (audioElement) audioElement.pause();
        if (bgTheme.value === 'custom') customVideoElement.pause();
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        cancelAnimationFrame(animationId);
    }

    stopRecordBtn.addEventListener('click', () => {
        stopRecordingProcess();
    });
</script>
</body>
