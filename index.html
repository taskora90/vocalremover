<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vocal & Video Splitter - Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .card-bg {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md card-bg rounded-2xl shadow-2xl p-6 md:p-8">
        <h1 class="text-2xl font-bold text-center mb-2 text-white">🎵 AI Vocal Splitter Pro</h1>
        <p class="text-xs text-center text-gray-400 mb-6">এআই (Demucs) দিয়ে ১০০% নিখুঁতভাবে ভয়েস ও মিউজিক আলাদা করুন!</p>

        <!-- API Token Input -->
        <div class="mb-4">
            <label class="block text-xs text-gray-400 mb-1">Replicate API Token (ফ্রি):</label>
            <input type="password" id="apiToken" placeholder="r8_xxxxxxxxxxxxxxxxxxx" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <p class="text-[10px] text-gray-500 mt-1">replicate.com থেকে একটি ফ্রি টোকেন নিয়ে এখানে দিন।</p>
        </div>

        <!-- File Upload Box -->
        <div class="border-2 border-dashed border-gray-600 rounded-xl p-6 text-center relative mb-6 bg-gray-900/50 hover:border-blue-400 transition cursor-pointer">
            <input type="file" id="mediaFile" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20" accept="audio/*,video/*">
            <div class="space-y-2 pointer-events-none relative z-10">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="text-sm text-gray-300">
                    <span class="font-semibold text-blue-400">ফাইল সিলেক্ট করুন</span> অথবা এখানে ট্যাপ করুন
                </div>
                <p class="text-xs text-gray-500">MP3, WAV, MP4 সমর্থিত</p>
            </div>
        </div>

        <!-- Selected File Info -->
        <div id="fileInfo" class="hidden mb-6 p-3 bg-gray-800 rounded-lg text-sm text-gray-300 flex justify-between items-center">
            <span id="fileName" class="truncate max-w-[220px]"></span>
            <span id="fileType" class="text-xs bg-blue-600 px-2 py-1 rounded text-white"></span>
        </div>

        <!-- Process Button -->
        <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg disabled:opacity-50" disabled>
            প্রো এআই দিয়ে আলাদা করুন
        </button>

        <!-- Progress Section -->
        <div id="progressSection" class="hidden mt-6 space-y-2">
            <div class="flex justify-between text-xs text-gray-400">
                <span id="statusText">প্রস্তুতি চলছে...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Download Section -->
        <div id="downloadSection" class="hidden mt-6 space-y-3">
            <h3 class="text-sm font-semibold text-gray-300">ডাউনলোড করুন:</h3>
            <div class="grid grid-cols-2 gap-3">
                <a id="downloadVocal" class="bg-green-600 hover:bg-green-700 text-center py-2.5 rounded-lg text-xs font-semibold text-white transition hidden" target="_blank">🎙️ ভোকাল (Voice)</a>
                <a id="downloadMusic" class="bg-purple-600 hover:bg-purple-700 text-center py-2.5 rounded-lg text-xs font-semibold text-white transition hidden" target="_blank">🎸 মিউজিক (Music)</a>
            </div>
        </div>
    </div>

    <!-- Replicate API Integration Script -->
    <script>
        const mediaFile = document.getElementById('mediaFile');
        const apiTokenInput = document.getElementById('apiToken');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileType = document.getElementById('fileType');
        const processBtn = document.getElementById('processBtn');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');
        const downloadSection = document.getElementById('downloadSection');

        let selectedFile = null;

        mediaFile.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileName.textContent = selectedFile.name;
                fileType.textContent = selectedFile.type && selectedFile.type.includes('video') ? 'ভিডিও ফাইল' : 'অডিও ফাইল';
                fileInfo.classList.remove('hidden');
                processBtn.removeAttribute('disabled');
            }
        });

        processBtn.addEventListener('click', async () => {
            const apiToken = apiTokenInput.value.trim();
            if (!apiToken) {
                alert('দয়া করে আপনার Replicate API Token দিন!');
                return;
            }
            if (!selectedFile) return;

            progressSection.classList.remove('hidden');
            processBtn.setAttribute('disabled', 'true');
            statusText.textContent = 'ফাইল আপলোড হচ্ছে...';
            progressBar.style.width = '20%';
            progressPercent.textContent = '20%';

            try {
                // 1. Upload file to temporary host or convert to Data URI / Blob URL for API
                // For Replicate, we can convert file to base64 data uri
                const reader = new FileReader();
                reader.readAsDataURL(selectedFile);
                
                reader.onload = async () => {
                    const fileBase64 = reader.result;

                    statusText.textContent = 'এআই সার্ভারে রিকুয়েস্ট পাঠানো হচ্ছে...';
                    progressBar.style.width = '40%';
                    progressPercent.textContent = '40%';

                    // Call Replicate API for Demucs model
                    const response = await fetch("https://api.replicate.com/v1/predictions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Token ${apiToken}`,
                            "Content-Type": "application/json",
                            "Prefer": "wait"
                        },
                        body: JSON.stringify({
                            version: "25a06ba760344d5a7d6537bf7c97ef31e457f5c786be62b55fbe7e7f0931215b", // Demucs model version
                            input: {
                                audio: fileBase64
                            }
                        })
                    });

                    if (!response.ok) {
                        throw new Error('সার্ভার থেকে রেসপন্স পেতে সমস্যা হয়েছে। টোকেন চেক করুন।');
                    }

                    statusText.textContent = 'এআই মডেল দিয়ে প্রসেসিং চলছে...';
                    progressBar.style.width = '70%';
                    progressPercent.textContent = '70%';

                    const prediction = await response.json();
                    
                    if (prediction.status === "succeeded" && prediction.output) {
                        finishProcess(prediction.output);
                    } else {
                        throw new Error('প্রসেসিং ব্যর্থ হয়েছে।');
                    }
                };

            } catch (error) {
                console.error(error);
                statusText.textContent = 'ত্রুটি ঘটেছে! সঠিক টোকেন ও ফাইল দিন।';
                processBtn.removeAttribute('disabled');
            }
        });

        function finishProcess(output) {
            statusText.textContent = 'প্রসেসিং সম্পন্ন!';
            progressBar.style.width = '100%';
            progressPercent.textContent = '100%';

            downloadSection.classList.remove('hidden');
            const vocalLink = document.getElementById('downloadVocal');
            const musicLink = document.getElementById('downloadMusic');

            // Demucs output usually provides { vocals: 'url', instrumental: 'url' } or array
            if (output.vocals && output.instrumental) {
                vocalLink.href = output.vocals;
                vocalLink.classList.remove('hidden');

                musicLink.href = output.instrumental;
                musicLink.classList.remove('hidden');
            }

            processBtn.removeAttribute('disabled');
        }
    </script>
</body>
</html>
