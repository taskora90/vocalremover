<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vocal & Instrumental Remover</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FFmpeg.wasm for handling video-to-audio extraction -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .card-bg {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md card-bg rounded-2xl shadow-2xl p-6 md:p-8">
        <h1 class="text-2xl font-bold text-center mb-2 text-white">🎵 Vocal & Video Splitter</h1>
        <p class="text-xs text-center text-gray-400 mb-6">ভিডিও বা অডিও থেকে ভয়েস ও মিউজিক আলাদা করুন কোনো লিমিট ছাড়াই!</p>

        <!-- File Upload Box -->
        <div class="border-2 border-dashed border-gray-600 rounded-xl p-6 text-center hover:border-gray-400 transition cursor-pointer relative mb-6">
            <input type="file" id="mediaFile" accept="audio/*,video/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <div class="space-y-2">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="text-sm text-gray-300">
                    <span class="font-semibold text-blue-400">ফাইল সিলেক্ট করুন</span> অথবা এখানে ড্রপ করুন
                </div>
                <p class="text-xs text-gray-500">MP3, WAV, MP4, MKV সমর্থিত</p>
            </div>
        </div>

        <!-- Selected File Info -->
        <div id="fileInfo" class="hidden mb-6 p-3 bg-gray-800 rounded-lg text-sm text-gray-300 flex justify-between items-center">
            <span id="fileName" class="truncate max-w-[250px]"></span>
            <span id="fileType" class="text-xs bg-blue-600 px-2 py-1 rounded text-white"></span>
        </div>

        <!-- Process Button -->
        <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg disabled:opacity-50" disabled>
            অডিও ও ভয়েস আলাদা করুন
        </button>

        <!-- Progress Section -->
        <div id="progressSection" class="hidden mt-6 space-y-2">
            <div class="flex justify-between text-xs text-gray-400">
                <span id="statusText">প্রস্তুতি চলছে...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Download Section (Hidden initially) -->
        <div id="downloadSection" class="hidden mt-6 space-y-3">
            <h3 class="text-sm font-semibold text-gray-300">ডাউনলোড করুন:</h3>
            <div class="grid grid-cols-2 gap-3">
                <a id="downloadVocal" class="bg-green-600 hover:bg-green-700 text-center py-2 rounded-lg text-xs font-semibold text-white transition hidden">🎙️ ভোকাল (Voice)</a>
                <a id="downloadMusic" class="bg-purple-600 hover:bg-purple-700 text-center py-2 rounded-lg text-xs font-semibold text-white transition hidden">🎸 মিউজিক (Music)</a>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const mediaFile = document.getElementById('mediaFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileType = document.getElementById('fileType');
        const processBtn = document.getElementById('processBtn');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');
        const downloadSection = document.getElementById('downloadSection');

        let selectedFile = null;

        mediaFile.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileName.textContent = selectedFile.name;
                fileType.textContent = selectedFile.type.includes('video') ? 'ভিডিও ফাইল' : 'অডিও ফাইল';
                fileInfo.classList.remove('hidden');
                processBtn.removeAttribute('disabled');
            }
        });

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            progressSection.classList.remove('hidden');
            processBtn.setAttribute('disabled', 'true');
            statusText.textContent = 'ফাইল লোড হচ্ছে...';
            progressBar.style.width = '20%';
            progressPercent.textContent = '20%';

            // যদি ফাইলটি ভিডিও হয়, তবে FFmpeg দিয়ে অডিও আলাদা করার লজিক এখানে কাজ করবে
            setTimeout(() => {
                statusText.textContent = 'এআই (AI) দিয়ে ভয়েস ও মিউজিক আলাদা করা হচ্ছে...';
                progressBar.style.width = '60%';
                progressPercent.textContent = '60%';
            }, 1500);

            setTimeout(() => {
                statusText.textContent = 'প্রসেসিং সম্পন্ন!';
                progressBar.style.width = '100%';
                progressPercent.textContent = '100%';
                
                // সফল হওয়ার পর ডাউনলোড অপশন দেখানোর সিম্যুলেশন
                downloadSection.classList.remove('hidden');
                document.getElementById('downloadVocal').classList.remove('hidden');
                document.getElementById('downloadMusic').classList.remove('hidden');
            }, 3000);
        });
    </script>
</body>
</html>
